<style>

  * { box-sizing: border-box; }
  body {

    color: var(--text);
    line-height: 1.45;

  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { font-size: 1.65rem; font-weight: 650; margin: 0 0 6px; letter-spacing: -0.02em; }
  h2 { font-size: 1.2rem; font-weight: 600; margin: 0 0 10px; }
  h3 { font-size: 1rem; font-weight: 600; margin: 18px 0 8px; color: var(--text); }
  .sub { color: var(--muted); font-size: 0.92rem; margin-bottom: 18px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 22px; }
  .tab {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .callout {
    border: 1px solid var(--border);
    background: var(--panel2);
    border-left: 3px solid var(--warning);
    padding: 12px 14px;
    border-radius: 8px;
    margin: 12px 0 18px;
    font-size: 0.92rem;
  }
  .callout.info { border-left-color: var(--info); }
  .callout.success { border-left-color: var(--success); }
  .callout.danger { border-left-color: var(--danger); }
  .callout strong { display: block; margin-bottom: 4px; }
  .grid { display: grid; gap: 12px; margin: 12px 0 18px; }
  .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 800px) {
    .grid-3, .grid-4, .grid-2 { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 520px) {
    .grid-3, .grid-4, .grid-2 { grid-template-columns: 1fr; }
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .stat .v { font-size: 1.25rem; font-weight: 650; }
  .stat .l { color: var(--muted); font-size: 0.78rem; margin-top: 4px; }
  .stat.success .v { color: var(--success); }
  .stat.warning .v { color: var(--warning); }
  .stat.danger .v { color: var(--danger); }
  .stat.info .v { color: var(--info); }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 16px 18px;
    margin: 14px 0;
  }
  .card h2, .card h3 { margin-top: 0; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.84rem;
    margin: 8px 0 14px;
  }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  th { color: var(--muted); font-weight: 550; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.hl-success td { background: rgba(62, 207, 142, 0.08); }
  tr.hl-info td { background: rgba(91, 184, 255, 0.07); }
  .muted { color: var(--muted); font-size: 0.86rem; }
  .dim { color: var(--dim); font-size: 0.8rem; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .pill {
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--muted);
    padding: 6px 11px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.82rem;
  }
  .pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  select {
    width: 100%;
    max-width: 520px;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 0.9rem;
  }
  .stack-gap > * + * { margin-top: 10px; }
  .hidden { display: none; }
  a { color: var(--accent); }
  .bar-wrap { margin: 10px 0 16px; }
  .bar-row { display: grid; grid-template-columns: 140px 1fr 64px; gap: 8px; align-items: center; margin: 5px 0; font-size: 0.82rem; }
  .bar-track { background: #252b38; height: 10px; border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 6px; }
  .bar-fill.success { background: var(--success); }
  .bar-fill.warning { background: var(--warning); }
</style>
</head>

<script>
const { DATA, LTV_GEO } = JSON.parse(document.getElementById('payload').textContent);

const fmtUSD = (v) => {
  if (v == null || Number.isNaN(Number(v))) return "—";
  const n = Number(v);
  if (Math.abs(n) >= 1000) return `$${(n / 1000).toFixed(n >= 10000 ? 0 : 1)}k`;
  return `$${n.toFixed(2)}`;
};
const fmtPct = (v, d = 1) => `${Number(v).toFixed(d)}%`;
const fmtN = (v) => Number(v).toLocaleString("en-US");

const state = {
  tab: "ltv",
  scopeKind: "country",
  geoId: LTV_GEO.defaultId || "Vietnam",
};

const TABS = [
  { id: "ltv", label: "LTV & CPA" },
  { id: "vietnam", label: "Vietnam deep dive" },
  { id: "priorities", label: "Scale & Test" },
  { id: "league", label: "Country league" },
  { id: "patterns", label: "Patterns" },
];

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content;
}

function table(headers, rows, opts = {}) {
  const aligns = opts.align || headers.map(() => "left");
  const tones = opts.tones || [];
  const head = headers.map((h, i) => `<th class="${aligns[i] === "right" ? "num" : ""}">${h}</th>`).join("");
  const body = rows.map((r, ri) => {
    const tone = tones[ri] ? `hl-${tones[ri]}` : "";
    const tds = r.map((c, i) => `<td class="${aligns[i] === "right" ? "num" : ""}">${c}</td>`).join("");
    return `<tr class="${tone}">${tds}</tr>`;
  }).join("");
  return `<div style="overflow:auto"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function stats(items) {
  return `<div class="grid grid-3">${items.map(i => `
    <div class="stat ${i.tone || ""}"><div class="v">${i.value}</div><div class="l">${i.label}</div></div>
  `).join("")}</div>`;
}

function bars(items, tone = "") {
  const max = Math.max(...items.map(i => i.value), 1);
  return `<div class="bar-wrap">${items.map(i => `
    <div class="bar-row">
      <div>${i.label}</div>
      <div class="bar-track"><div class="bar-fill ${tone}" style="width:${(100 * i.value / max).toFixed(1)}%"></div></div>
      <div class="num">${typeof i.display === "string" ? i.display : fmtN(i.value)}</div>
    </div>
  `).join("")}</div>`;
}

function renderShell() {
  const k = DATA.kpis;
  document.getElementById("subtitle").textContent =
    `Source: PPC partners export · onboarded ${k.dateStart} → ${k.dateEnd} · LTV from Deriv partner revenue share (deriv.com/partners)`;
  document.getElementById("topCallout").innerHTML =
    `<strong>Commission is extremely concentrated</strong>
     ${k.topCountry} alone is ${fmtPct(k.topCountryShare)} of all commission
     (${fmtUSD(k.topCountryComm)} of ${fmtUSD(k.commission)}). Only ${fmtN(k.earners)} of
     ${fmtN(k.affiliates)} affiliates (${fmtPct(k.earnerPct, 2)}) ever earned.`;
  document.getElementById("topKpis").innerHTML = [
    ["Affiliates", fmtN(k.affiliates)],
    ["Countries", String(k.countries)],
    ["Total commission", fmtUSD(k.commission), "success"],
    ["Earners", `${fmtN(k.earners)} (${fmtPct(k.earnerPct, 2)})`, "warning"],
    ["Active rate", fmtPct(k.activePct)],
    [`${k.topCountry} commission share`, fmtPct(k.topCountryShare), "danger"],
  ].map(([l,v,t]) => `<div class="stat ${t||""}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");

  document.getElementById("tabs").innerHTML = TABS.map(t =>
    `<button class="tab ${state.tab===t.id?"active":""}" data-tab="${t.id}">${t.label}</button>`
  ).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });
}

function renderLtv() {
  const s = DATA.ltv.summary;
  const optionsForKind = LTV_GEO.options.filter(o => o.kind === state.scopeKind);
  if (!optionsForKind.some(o => o.id === state.geoId)) {
    state.geoId = optionsForKind[0]?.id || LTV_GEO.defaultId;
  }
  const ent = LTV_GEO.entities[state.geoId];
  const a = ent.layerA, b = ent.layerB;
  const earnCamps = ent.campaigns.filter(c => c.commission > 0);
  const kindLabel = ent.kind === "program" ? "program-wide" : ent.kind === "region" ? "this region" : "this country";
  const zeroComm = ent.commission <= 0;

  const selectOpts = optionsForKind.map(o => {
    const comm = o.commission >= 1000 ? `$${(o.commission/1000).toFixed(1)}k` : `$${o.commission.toFixed(0)}`;
    const label = o.kind === "program"
      ? `${o.id} (${fmtN(o.n)} aff)`
      : `${o.id} · ${fmtN(o.n)} aff · ${comm} comm`;
    return `<option value="${o.id.replace(/"/g,"&quot;")}" ${o.id===state.geoId?"selected":""}>${label}</option>`;
  }).join("");

  return `
    <div class="callout info"><strong>How LTV is defined here</strong>
      Options revenue share pays affiliates up to 45% of Deriv’s revenue. Deriv gross ≈ Commission ÷ α (α = 45%).
      Deriv net keep = gross × (1 − α). CPA caps below = net keep × payback share. Switch country or region to recompute all three layers.
    </div>
    ${stats([
      { value: fmtUSD(s.totalDerivGross45), label: "Program Deriv gross LTV (α=45%)", tone: "success" },
      { value: fmtUSD(s.totalDerivNet45), label: "Program Deriv net keep" },
      { value: fmtUSD(s.blendedLtvSignup), label: "Blended LTV / affiliate signup", tone: "warning" },
    ])}
    <div class="card">
      <h2>CPA math — three layers</h2>
      <div class="stack-gap">
        <div><strong>Scope</strong></div>
        <div class="pills" id="scopePills">
          <button class="pill ${state.scopeKind==="country"?"active":""}" data-kind="country">Countries</button>
          <button class="pill ${state.scopeKind==="region"?"active":""}" data-kind="region">Regions</button>
          <button class="pill ${state.scopeKind==="program"?"active":""}" data-kind="program">All countries</button>
        </div>
        ${state.scopeKind !== "program" ? `<select id="geoSelect">${selectOpts}</select>` : ""}
        <p class="muted">Selected: ${ent.id} · ${fmtN(ent.n)} affiliates · ${fmtN(ent.earners)} earners (${fmtPct(ent.earnRate)}) · commission ${fmtUSD(ent.commission)} · Deriv gross ${fmtUSD(ent.derivGross)} · net keep ${fmtUSD(ent.derivNet)}</p>
        ${zeroComm ? `<div class="callout"><strong>Observed commission is $0</strong> Blended LTV and CPA caps are $0 for ${ent.id}. Use exploratory test CPA only, or open Vietnam for a working benchmark.</div>` : ""}
        <p>Layer A — Blended signup CPA: cost to acquire any onboard in ${ent.id}. Expected Deriv net keep = ${fmtUSD(a.netSignup)}. CPA tiers: ${fmtUSD(a.cpa50)} (50% payback), ${fmtUSD(a.cpa30)} (conservative 30%), ${fmtUSD(a.cpa100)} (ceiling 100%). Gross LTV / signup = ${fmtUSD(a.ltvSignup)}.</p>
        <p>Layer B — Stage-gated CPA: value jumps if you only pay on quality events. CPA50 for ${kindLabel}: Active (n=${fmtN(b.activeN)}) ≈ ${fmtUSD(b.activeCpa50)}; Clients&gt;0 (n=${fmtN(b.clientsN)}) ≈ ${fmtUSD(b.clientsCpa50)}; Funded (n=${fmtN(b.fundedN)}) ≈ ${fmtUSD(b.fundedCpa50)}; Earner (n=${fmtN(b.earnerN)}) ≈ ${fmtUSD(b.earnerCpa50)}. Requires reliable postbacks.</p>
        <p>Layer C — Channel/campaign CPA: weight budget to mixes that historically produce earners in ${ent.id}.
          ${earnCamps.length === 0
            ? " No campaign in this scope has paid commission yet — no campaign-level CPA headroom."
            : " Top earning lines (CPA50): " + earnCamps.slice(0,4).map(c => `${c.campaign} ~${fmtUSD(c.cpa50)} (${fmtPct(c.earnRate)} earn, n=${c.n})`).join("; ") + "."}
        </p>
        ${table(
          ["If you acquire…","n","Deriv LTV","Net keep","CPA 30%","CPA 50%","CPA 100%"],
          ent.stageEcon.map(r => [r.stage, fmtN(r.n), fmtUSD(r.ltv), fmtUSD(r.net), fmtUSD(r.cpa30), fmtUSD(r.cpa50), fmtUSD(r.cpa100)]),
          { align: ["left","right","right","right","right","right","right"] }
        )}
        ${ent.campaigns.length ? `<h3>Campaign CPA detail — ${ent.id}</h3>` + table(
          ["Campaign","n","Earn %","Commission","LTV / signup","CPA 50%"],
          ent.campaigns.map(c => [c.campaign, fmtN(c.n), fmtPct(c.earnRate), fmtUSD(c.commission), fmtUSD(c.ltvSignup), fmtUSD(c.cpa50)]),
          { align: ["left","right","right","right","right","right"] }
        ) : ""}
        ${ent.sources.length ? `<h3>Source CPA detail — ${ent.id}</h3>` + table(
          ["Source","n","Earn %","LTV / signup","CPA 50%"],
          ent.sources.map(src => [src.source, fmtN(src.n), fmtPct(src.earnRate), fmtUSD(src.ltvSignup), fmtUSD(src.cpa50)]),
          { align: ["left","right","right","right","right"] }
        ) : ""}
      </div>
    </div>
    <h2>CPA caps — Scale countries (observed)</h2>
    ${table(
      ["Country","LTV / signup","Net keep / signup","CPA 100%","CPA 50%","CPA 30%","Guidance"],
      DATA.ltv.recommendations.map(r => [r.country, fmtUSD(r.ltvGross), fmtUSD(r.ltvNet), fmtUSD(r.cpaAggressive), fmtUSD(r.cpaBase), fmtUSD(r.cpaConservative), r.note]),
      { align: ["left","right","right","right","right","right","left"], tones: DATA.ltv.recommendations.map(r => r.country==="Vietnam"?"success":undefined) }
    )}
    <h2>Test countries — observed LTV is $0</h2>
    ${table(
      ["Country","Affiliates","Client rate","Observed LTV","Prior LTV","Suggested test CPA"],
      DATA.ltv.testPriors.map(r => [r.country, fmtN(r.affiliates), fmtPct(r.clientRate), fmtUSD(r.observedLtv), fmtUSD(r.priorLtvGross), fmtUSD(r.cpaTestSuggest)]),
      { align: ["left","right","right","right","right","right"] }
    )}
  `;
}

function renderVietnam() {
  const v = DATA.vietnam, k = v.kpis, e = v.earnerDist, cpa = v.cpaPolicy;
  return `
    <h2>Vietnam — LTV & CPA deep dive</h2>
    <p class="muted">Every column in the export, applied to Vietnam only (${fmtN(k.affiliates)} affiliates).</p>
    <div class="callout info"><strong>LTV definition (Deriv’s side)</strong>
      On deriv.com/partners, Options revenue share pays up to 45% of Deriv revenue. Deriv gross ≈ Commission ÷ 0.45;
      net keep ≈ gross × 55%. α = 45% is a conservative lower bound on Deriv LTV. Figures are observed-to-date.
    </div>
    <h3>1. Raw columns</h3>
    <div class="grid grid-4">
      ${[
        [fmtN(k.affiliates),"Affiliates onboarded"],
        [fmtPct(k.activeRate),"Active (= clients>0 here)"],
        [fmtN(k.ownDeposit),"Affiliate own first deposit"],
        [fmtN(k.withClients),"With clients acquired","info"],
        [fmtN(k.funded),"Funded (client first deposit)"],
        [`${fmtN(k.earners)} (${fmtPct(k.earnRate)})`,"Commission > 0","success"],
        [fmtN(k.clientsTotal),"Clients acquired (sum)"],
        [String(k.subAffiliates),"Direct sub-affiliates","warning"],
        [fmtUSD(k.commission),"Commissions USD","success"],
        [fmtUSD(k.clientDep),"Client deposits USD"],
        [fmtUSD(k.clientPnl),"Client PnL USD"],
        [fmtUSD(k.affDep),"Affiliate deposits USD"],
      ].map(([v,l,t])=>`<div class="stat ${t||""}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("")}
    </div>
    <h3>2. Funnel</h3>
    ${bars(v.funnel.map(f => ({ label: f.step, value: f.n, display: `${fmtN(f.n)} (${fmtPct(f.rate)})` })))}
    ${table(
      ["Step","Count","% of onboarded","Conditional note"],
      [
        ["Onboarded", fmtN(k.affiliates), "100%", "Onboarded (Affiliate Joined)"],
        ["Active", fmtN(k.active), fmtPct(k.activeRate), "Matches clients>0 in this extract"],
        ["Own deposit", fmtN(k.ownDeposit), fmtPct(100*k.ownDeposit/k.affiliates), "Rare among earners"],
        ["Clients > 0", fmtN(k.withClients), fmtPct(k.clientRate), "Clients Acquired"],
        ["Funded client", fmtN(k.funded), fmtPct(k.fundedRate), `P(funded|clients)=${fmtPct(k.pFundedGivenClients)}`],
        ["Commission > 0", fmtN(k.earners), fmtPct(k.earnRate), `P(earn|funded)=${fmtPct(k.pEarnGivenFunded)}`],
      ],
      { align: ["left","right","right","left"] }
    )}
    <h3>3. Deriv LTV from commission</h3>
    ${stats([
      { value: fmtUSD(k.derivGross), label: "Deriv gross LTV (Comm ÷ 0.45)", tone: "success" },
      { value: fmtUSD(k.derivNet), label: "Deriv net keep (55% of gross)" },
      { value: fmtPct(k.commToCdep), label: "Commission / client deposits" },
      { value: fmtUSD(k.ltvSignup), label: "LTV / blended signup", tone: "info" },
      { value: fmtUSD(k.netSignup), label: "Net keep / blended signup" },
      { value: fmtUSD(k.ltvEarner), label: "LTV / earning affiliate", tone: "success" },
    ])}
    <div class="card">
      <h2>CPA math — three layers</h2>
      <p>Layer A — Blended signup CPA: Expected Deriv net keep = ${fmtUSD(k.netSignup)}. CPA: ${fmtUSD(cpa.blended50)} (50%), ${fmtUSD(cpa.blended30)} (30%), ${fmtUSD(cpa.blended100)} (100%).</p>
      <p>Layer B — Stage-gated CPA50: Active ≈ ${fmtUSD(cpa.active50)}; Funded ≈ ${fmtUSD(cpa.funded50)}; Earner ≈ ${fmtUSD(cpa.earner50)}.</p>
      <p>Layer C — Campaign CPA50: FB Survey ≈ ${fmtUSD(cpa.surveyCpa50||0)}; Taboola ≈ ${fmtUSD(cpa.taboolaCpa50||0)}; VN Google brand ≈ ${fmtUSD(cpa.googleBrandCpa50||0)}; VI FB USP ≈ ${fmtUSD(cpa.viFbCpa50||0)}.</p>
      ${table(
        ["If you acquire…","n","Deriv LTV","Net keep","CPA 30%","CPA 50%","CPA 100%"],
        v.stageEcon.map(s => [s.stage, fmtN(s.n), fmtUSD(s.ltv), fmtUSD(s.net), fmtUSD(s.cpa30), fmtUSD(s.cpa50), fmtUSD(s.cpa100)]),
        { align: ["left","right","right","right","right","right","right"] }
      )}
    </div>
    <h3>4. Earner distribution</h3>
    ${bars([
      { label: "p25", value: e.ltvP25, display: fmtUSD(e.ltvP25) },
      { label: "p50", value: e.ltvP50, display: fmtUSD(e.ltvP50) },
      { label: "p75", value: e.ltvP75, display: fmtUSD(e.ltvP75) },
      { label: "p90", value: e.ltvP90, display: fmtUSD(e.ltvP90) },
      { label: "Max", value: e.ltvMax, display: fmtUSD(e.ltvMax) },
    ], "success")}
    <h3>5. Correlations</h3>
    ${table(["Columns","r","Meaning for CPA"], v.correlations.map(c => [c.pair, c.r==null?"n/a":c.r.toFixed(3), c.note]), { align:["left","right","left"] })}
    <h3>6. Source & medium</h3>
    ${table(["Source","Affiliates","Earn %","Commission","LTV / signup","CPA 50%"],
      v.sources.map(s => [s.source, fmtN(s.n), fmtPct(s.earnRate), fmtUSD(s.commission), fmtUSD(s.ltvSignup), fmtUSD(s.cpa50)]),

    ${table(["Medium","Affiliates","Earn %","Commission","LTV / signup","CPA 50%"],

      { align:["left","right","right","right","right","right"] })}
    <h3>7. Campaigns</h3>
    ${table(["Campaign","n","Earn %","Clients","Funded","Commission","LTV / sig","CPA 50%"],
      v.campaigns.filter(c => c.commission>0 || c.n>=7).map(c => [c.campaign, fmtN(c.n), fmtPct(c.earnRate), fmtN(c.clients), String(c.funded), fmtUSD(c.commission), fmtUSD(c.ltvSignup), fmtUSD(c.cpa50)]),
      { align:["left","right","right","right","right","right","right","right"] })}
    <h3>8. Monthly cohorts</h3>
    ${table(["Month","Signups","Earners","Earn %","Commission","LTV / signup"],
      v.monthly.map(m => [m.month, fmtN(m.n), String(m.earners), fmtPct(m.earnRate), fmtUSD(m.commission), fmtUSD(m.ltvSignup)]),
      { align:["left","right","right","right","right","right"] })}
    <div class="callout success"><strong>Vietnam CPA policy</strong>
      Default blended CPA cap: ${fmtUSD(cpa.blended30)}–${fmtUSD(cpa.blended50)}. Weight budget to Survey/Taboola-like USP;
      constrain ebook & zero-earn campaigns. Do not optimize on affiliate own-deposit or sub-affiliates here.
    </div>
    <h3>Key insights</h3>
    <ol class="muted">${v.insights.map(i => `<li>${i}</li>`).join("")}</ol>
  `;
}

function renderPriorities() {
  const avoid = DATA.avoid.map(a => `${a.country} (${fmtN(a.affiliates)})`).join(", ");
  const row = (r) => [r.country, fmtN(r.affiliates), String(r.earners), fmtPct(r.earnRate, r.earnRate>=1?1:2), fmtUSD(r.commission), fmtN(r.clients), fmtUSD(r.clientDep), r.score.toFixed(1), r.action];
  return `
    <div class="grid grid-2">
      <div class="card"><h2>Scale these</h2>
        ${table(["Country","Affiliates","Earners","Earn %","Commission","Clients","Client dep.","Score","Action"],
          DATA.scale.map(row), { align:["left","right","right","right","right","right","right","right","left"], tones: DATA.scale.map(r=>r.country==="Vietnam"?"success":undefined) })}
      </div>
      <div class="card"><h2>Test these</h2>
        ${table(["Country","Affiliates","Earners","Earn %","Commission","Clients","Client dep.","Score","Action"],
          DATA.test.map(row), { align:["left","right","right","right","right","right","right","right","left"] })}
      </div>
    </div>
    <div class="callout"><strong>Deprioritize (high volume, weak funnel)</strong>${avoid}</div>
    <h2>Funnel conversion — Scale & Test</h2>
    ${bars(DATA.funnel.map(f => ({ label: f.country, value: f.commRate, display: `${fmtPct(f.commRate)} earn` })), "success")}
    <p class="dim">Bars show commission rate (% of affiliates). Active/client/funded rates are in the source canvas tables.</p>
  `;
}

function renderLeague() {
  return `
    <h2>Top 25 countries by composite score</h2>
    ${table(["Country","Score","Affiliates","Earners","Earn %","Commission","Share","Clients","Funded","Action"],
      DATA.league.map(r => [r.country, r.score.toFixed(1), fmtN(r.affiliates), String(r.earners), fmtPct(r.earnRate, r.earnRate>=1?1:2), fmtUSD(r.commission), fmtPct(r.commShare, r.commShare>=1?1:2), fmtN(r.clients), String(r.funded), r.action || "—"]),
      { align:["left","right","right","right","right","right","right","right","right","left"],
        tones: DATA.league.map(r => r.action==="Scale"?"success": r.action==="Test"?"info": undefined) })}
  `;
}

function renderPatterns() {
  const s = DATA.speedSignals;
  return `
    <h2>Channel mix — earning vs non-earning countries</h2>
    <div class="grid grid-2">
      <div class="card"><h3>Earning countries — source</h3>
        ${bars(DATA.channelMix.earningCountrySources.map(x => ({ label: x.label, value: x.pct, display: fmtPct(x.pct) })), "success")}
      </div>
      <div class="card"><h3>Non-earning countries — source</h3>
        ${bars(DATA.channelMix.nonEarningCountrySources.map(x => ({ label: x.label, value: x.pct, display: fmtPct(x.pct) })))}
      </div>
    </div>
    <h2>Top campaigns by commission</h2>
    ${table(["Campaign","Commission","Earners","Affiliates","Top country"],
      DATA.topCampaigns.map(c => [c.campaign, fmtUSD(c.commission), String(c.earners), fmtN(c.affiliates), c.topCountry]),
      { align:["left","right","right","right","left"] })}
    <h2>Speed signals</h2>
    ${stats([
      { value: s.earnersMedDaysFirstClient!=null?`${s.earnersMedDaysFirstClient}d`:"—", label: `Median days to first client (earners, n=${s.nEarnersCli})`, tone:"success" },
      { value: s.nonEarnersMedDaysFirstClient!=null?`${s.nonEarnersMedDaysFirstClient}d`:"—", label: `Median days to first client (non-earners, n=${s.nNonCli})` },
    ])}
    <h2>Correlations with commission</h2>
    ${table(["Relationship","r","Takeaway"], DATA.correlations.map(c => [c.pair, c.r==null?"—":c.r.toFixed(3), c.note]), { align:["left","right","left"] })}
  `;
}

function bindLtvControls() {
  document.querySelectorAll("#scopePills .pill").forEach(p => {
    p.onclick = () => {
      state.scopeKind = p.dataset.kind;
      if (state.scopeKind === "country") state.geoId = "Vietnam";
      if (state.scopeKind === "region") state.geoId = "Southeast Asia";
      if (state.scopeKind === "program") state.geoId = "All countries";
      render();
    };
  });
  const sel = document.getElementById("geoSelect");
  if (sel) sel.onchange = () => { state.geoId = sel.value; render(); };
}

function render() {
  renderShell();
  const app = document.getElementById("app");
  if (state.tab === "ltv") app.innerHTML = renderLtv();
  else if (state.tab === "vietnam") app.innerHTML = renderVietnam();
  else if (state.tab === "priorities") app.innerHTML = renderPriorities();
  else if (state.tab === "league") app.innerHTML = renderLeague();
  else app.innerHTML = renderPatterns();
  if (state.tab === "ltv") bindLtvControls();
  window.scrollTo({ top: 0, behavior: "instant" });
}

render();
</script>
</body>
</html>
