  .tab.active,.pill.active{background:var(--accent);border-color:var(--accent);color:#fff}

  .pill.non.active{background:var(--info);border-color:var(--info);color:#111}

  .callout strong{display:block;margin-bottom:4px}
  .grid{display:grid;gap:12px;margin:12px 0 18px}
  .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  @media(max-width:800px){.grid-3,.grid-4,.grid-2{grid-template-columns:1fr 1fr}}
  @media(max-width:520px){.grid-3,.grid-4,.grid-2{grid-template-columns:1fr}}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
  .stat .v{font-size:1.25rem;font-weight:650} .stat .l{color:var(--muted);font-size:.78rem;margin-top:4px}
  .stat.success .v{color:var(--success)} .stat.warning .v{color:var(--warning)} .stat.danger .v{color:var(--danger)} .stat.info .v{color:var(--info)}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin:14px 0}
  table{width:100%;border-collapse:collapse;font-size:.84rem;margin:8px 0 14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  th{color:var(--muted);font-weight:550;white-space:nowrap}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.hl-success td{background:rgba(62,207,142,.08)} tr.hl-info td{background:rgba(91,184,255,.07)} tr.hl-warning td{background:rgba(230,184,77,.08)}
  .muted{color:var(--muted);font-size:.86rem} .dim{color:var(--dim);font-size:.8rem}
  select{width:100%;max-width:520px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:.9rem}
  .bar-wrap{margin:10px 0 16px}
  .bar-row{display:grid;grid-template-columns:140px 1fr 70px;gap:8px;align-items:center;margin:5px 0;font-size:.82rem}
  .bar-track{background:#252b38;height:10px;border-radius:6px;overflow:hidden}
  .bar-fill{height:100%;background:var(--accent);border-radius:6px}
  .bar-fill.success{background:var(--success)} .bar-fill.warning{background:var(--warning)}
  .compare{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:8px}
  @media(max-width:700px){.compare{grid-template-columns:1fr}}
</style>

<script>
const P = JSON.parse(document.getElementById('payload').textContent);
const state = { seg: 'all', tab: 'ltv', scopeKind: 'country', geoId: 'Vietnam' };
const TABS = [
  {id:'ltv',label:'LTV & CPA'},
  {id:'vietnam',label:'Vietnam'},
  {id:'priorities',label:'Scale & Test'},
  {id:'league',label:'Country league'},
  {id:'patterns',label:'Patterns'},
];

const fmtUSD = (v) => {
  if (v == null || Number.isNaN(Number(v))) return '—';
  const n = Number(v);
  if (Math.abs(n) >= 1000) return `$${(n/1000).toFixed(n >= 10000 ? 0 : 1)}k`;
  return `$${n.toFixed(2)}`;
};
const fmtPct = (v,d=1) => `${Number(v).toFixed(d)}%`;
const fmtN = (v) => Number(v).toLocaleString('en-US');
const seg = () => P.segments[state.seg];

function table(headers, rows, opts={}) {
  const aligns = opts.align || headers.map(()=> 'left');
  const tones = opts.tones || [];
  const head = headers.map((h,i)=>`<th class="${aligns[i]==='right'?'num':''}">${h}</th>`).join('');
  const body = rows.map((r,ri)=>{
    const tone = tones[ri] ? `hl-${tones[ri]}` : '';
    return `<tr class="${tone}">${r.map((c,i)=>`<td class="${aligns[i]==='right'?'num':''}">${c}</td>`).join('')}</tr>`;
  }).join('');
  return `<div style="overflow:auto"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function bars(items, tone='') {
  const max = Math.max(...items.map(i=>i.value), 1);
  return `<div class="bar-wrap">${items.map(i=>`
    <div class="bar-row"><div>${i.label}</div>
    <div class="bar-track"><div class="bar-fill ${tone}" style="width:${(100*i.value/max).toFixed(1)}%"></div></div>
    <div class="num">${i.display ?? fmtN(i.value)}</div></div>`).join('')}</div>`;
}

  document.getElementById('compareStrip').innerHTML = `
    <div class="stat"><div class="v">${fmtUSD(a.cpa50)}</div><div class="l">All · CPA50 / signup</div></div>
    <div class="stat warning"><div class="v">${fmtUSD(w.cpa50)}</div><div class="l">Whales · CPA50 / whale</div></div>
    <div class="stat info"><div class="v">${fmtUSD(n.cpa50)}</div><div class="l">Non-whales · CPA50 / signup</div></div>`;

  document.getElementById('topKpis').innerHTML = [
    [fmtN(k.affiliates),'Affiliates in view'],
    [fmtN(k.whales),'Whales in view','warning'],
    [fmtUSD(k.commission),'Commission','success'],
    [`${fmtN(k.earners)} (${fmtPct(k.earnerPct)})`,'Earners'],
    [fmtUSD(k.ltvSignup),'Deriv LTV / signup','info'],
    [fmtUSD(k.cpa50),'CPA 50% (blended)','warning'],
  ].map(([v,l,t])=>`<div class="stat ${t||''}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');

  document.getElementById('tabs').innerHTML = TABS.map(t=>
    `<button class="tab ${state.tab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });
  document.querySelectorAll('#segPills .pill').forEach(b => {
    b.classList.toggle('active', b.dataset.seg === state.seg);
    b.onclick = () => {
      state.seg = b.dataset.seg;
      const g = seg().geo;
      state.geoId = g.defaultId;
      state.scopeKind = 'country';
      if (state.seg === 'whales') state.tab = 'ltv';
      render();
    };
  });
}

function renderLtv() {
  const S = seg();
  const geo = S.geo;
  const optionsForKind = geo.options.filter(o => o.kind === state.scopeKind);
  if (!optionsForKind.some(o => o.id === state.geoId)) state.geoId = optionsForKind[0]?.id || geo.defaultId;
  const ent = geo.entities[state.geoId];
  if (!ent) return `<div class="callout">No entities in this segment.</div>`;
  const a = ent.layerA, b = ent.layerB;
  const earnCamps = (ent.campaigns||[]).filter(c => c.commission > 0);
  const kindLabel = ent.kind === 'program' ? 'program-wide' : ent.kind === 'region' ? 'this region' : 'this country';
  const selectOpts = optionsForKind.map(o => {
    const comm = o.commission >= 1000 ? `$${(o.commission/1000).toFixed(1)}k` : `$${Number(o.commission).toFixed(0)}`;
    const label = o.kind === 'program' ? `${o.id} (${fmtN(o.n)} aff)` : `${o.id} · ${fmtN(o.n)} aff · ${comm} comm`;
    return `<option value="${o.id.replace(/"/g,'&quot;')}" ${o.id===state.geoId?'selected':''}>${label}</option>`;
  }).join('');

  const segNote = state.seg === 'whales'
    ? 'Whale-only view: every row is already a high-commission affiliate. Blended CPA here is the value of acquiring an affiliate who becomes a whale — not a bid for random signups.'
    : state.seg === 'non_whales'
      ? 'Non-whale view excludes p75+ commission affiliates. This is the realistic CPA for undifferentiated volume; Vietnam still leads but LTV collapses without whales.'
      : 'All affiliates. Use Whales / Non-whales toggles to see concentration.';

  return `
    <div class="callout info"><strong>How LTV is defined</strong>
      Deriv gross ≈ Commission ÷ 0.45; net keep ≈ gross × 55%. CPA = net keep × payback share.
      <br/><br/>${segNote}
    </div>
    <div class="card">
      <h2>CPA math — three layers <span class="muted">(${state.seg === 'all' ? 'All' : state.seg === 'whales' ? 'Whales' : 'Non-whales'})</span></h2>
      <div class="pills" id="scopePills">
        <button class="pill ${state.scopeKind==='country'?'active':''}" data-kind="country">Countries</button>
        <button class="pill ${state.scopeKind==='region'?'active':''}" data-kind="region">Regions</button>
        <button class="pill ${state.scopeKind==='program'?'active':''}" data-kind="program">All countries</button>
      </div>
      ${state.scopeKind !== 'program' ? `<select id="geoSelect">${selectOpts}</select>` : ''}
      <p class="muted">Selected: ${ent.id} · ${fmtN(ent.n)} aff · ${fmtN(ent.earners)} earners · whales ${fmtN(ent.whales||0)} · commission ${fmtUSD(ent.commission)} · net keep ${fmtUSD(ent.derivNet)}</p>
      <p>Layer A — Blended signup CPA for ${ent.id}: net keep ${fmtUSD(a.netSignup)}. CPA50 ${fmtUSD(a.cpa50)} · CPA30 ${fmtUSD(a.cpa30)} · CPA100 ${fmtUSD(a.cpa100)}. Gross LTV/signup ${fmtUSD(a.ltvSignup)}.</p>
      <p>Layer B — Stage-gated CPA50 (${kindLabel}): Active (n=${fmtN(b.activeN)}) ${fmtUSD(b.activeCpa50)}; Clients&gt;0 (n=${fmtN(b.clientsN)}) ${fmtUSD(b.clientsCpa50)}; Funded (n=${fmtN(b.fundedN)}) ${fmtUSD(b.fundedCpa50)}; Earner (n=${fmtN(b.earnerN)}) ${fmtUSD(b.earnerCpa50)}.</p>
      <p>Layer C — Campaign CPA50: ${earnCamps.length ? earnCamps.slice(0,4).map(c=>`${c.campaign} ~${fmtUSD(c.cpa50)} (${fmtPct(c.earnRate)} earn)`).join('; ') : 'No earning campaigns in this slice.'}</p>
      ${table(['If you acquire…','n','Deriv LTV','Net keep','CPA 30%','CPA 50%','CPA 100%'],
        ent.stageEcon.map(r=>[r.stage, fmtN(r.n), fmtUSD(r.ltv), fmtUSD(r.net), fmtUSD(r.cpa30), fmtUSD(r.cpa50), fmtUSD(r.cpa100)]),
        {align:['left','right','right','right','right','right','right']})}
      ${(ent.campaigns||[]).length ? `<h3>Campaigns — ${ent.id}</h3>` + table(['Campaign','n','Earn %','Commission','LTV/sig','CPA50'],
        ent.campaigns.map(c=>[c.campaign,fmtN(c.n),fmtPct(c.earnRate),fmtUSD(c.commission),fmtUSD(c.ltvSignup),fmtUSD(c.cpa50)]),
        {align:['left','right','right','right','right','right']}) : ''}
    </div>
    <h2>Country CPA snapshot (this segment)</h2>
    ${table(['Country','Affiliates','Whales','Earners','Commission','LTV/sig','CPA50','Score'],
      S.league.slice(0,15).map(r=>[r.country,fmtN(r.affiliates),fmtN(r.whales),String(r.earners),fmtUSD(r.commission),fmtUSD(r.ltvSignup),fmtUSD(r.cpa50),r.score.toFixed(1)]),
      {align:['left','right','right','right','right','right','right','right'],
       tones: S.league.slice(0,15).map(r=>r.action==='Scale'?'success':r.action==='Test'?'info':undefined)})}
  `;
}

function renderVietnam() {
  const v = seg().vietnam;
  if (!v || !v.n) return `<div class="callout">No Vietnam affiliates in the <strong>${state.seg}</strong> segment.</div>`;
  return `
    <h2>Vietnam — ${state.seg === 'whales' ? 'Whales only' : state.seg === 'non_whales' ? 'Non-whales only' : 'All affiliates'}</h2>
    <div class="grid grid-3">
      <div class="stat"><div class="v">${fmtN(v.n)}</div><div class="l">Vietnam affiliates in view</div></div>
      <div class="stat warning"><div class="v">${fmtN(v.whales)}</div><div class="l">Whales</div></div>
      <div class="stat success"><div class="v">${fmtUSD(v.commission)}</div><div class="l">Commission</div></div>
      <div class="stat info"><div class="v">${fmtUSD(v.ltvSignup)}</div><div class="l">Deriv LTV / signup</div></div>
      <div class="stat"><div class="v">${fmtUSD(v.netSignup)}</div><div class="l">Net keep / signup</div></div>
      <div class="stat warning"><div class="v">${fmtUSD(v.cpa50)}</div><div class="l">CPA 50%</div></div>
    </div>
    <div class="card">
      <h2>CPA math — three layers (Vietnam)</h2>
      ${table(['If you acquire…','n','Deriv LTV','Net keep','CPA 30%','CPA 50%','CPA 100%'],
        v.stageEcon.map(s=>[s.stage,fmtN(s.n),fmtUSD(s.ltv),fmtUSD(s.net),fmtUSD(s.cpa30),fmtUSD(s.cpa50),fmtUSD(s.cpa100)]),
        {align:['left','right','right','right','right','right','right']})}
    </div>
    <div class="callout ${state.seg==='non_whales'?'info':'success'}">
      <strong>Takeaway</strong>
      ${state.seg==='whales'
        ? `All ${fmtN(v.whales)} program whales are Vietnamese. Whale CPA50 ≈ ${fmtUSD(v.cpa50)} is the economics if you can identify/recruit whale-quality partners — not a Meta bid for cold traffic.`
        : state.seg==='non_whales'
          ? `Without whales, Vietnam commission falls to ${fmtUSD(v.commission)} and CPA50 to ${fmtUSD(v.cpa50)}. Still the best non-whale market, but an order of magnitude thinner than the all-in view.`
          : `Vietnam hosts 100% of whales (${fmtN(v.whales)}). All-in CPA50 ${fmtUSD(v.cpa50)} mixes whale and non-whale economics — toggle segments to separate them.`}
    </div>
  `;
}

function renderPriorities() {
  const S = seg();
  const row = r => [r.country, fmtN(r.affiliates), fmtN(r.whales), String(r.earners), fmtPct(r.earnRate, r.earnRate>=1?1:2), fmtUSD(r.commission), fmtUSD(r.cpa50), r.score.toFixed(1), r.action];
  const avoid = (S.avoid||[]).map(a=>`${a.country} (${fmtN(a.affiliates)})`).join(', ') || 'None in this segment';
  return `
    <div class="grid grid-2">
      <div class="card"><h2>Scale</h2>
        ${S.scale.length ? table(['Country','Aff','Whales','Earners','Earn%','Comm','CPA50','Score','Action'], S.scale.map(row),
          {align:['left','right','right','right','right','right','right','right','left'], tones:S.scale.map(r=>r.country==='Vietnam'?'success':undefined)})
          : '<p class="muted">No Scale countries in this segment.</p>'}
      </div>
      <div class="card"><h2>Test</h2>
        ${S.test.length ? table(['Country','Aff','Whales','Earners','Earn%','Comm','CPA50','Score','Action'], S.test.map(row),
          {align:['left','right','right','right','right','right','right','right','left']})
          : '<p class="muted">No Test countries in this segment.</p>'}
      </div>
    </div>
    <div class="callout"><strong>Deprioritize</strong>${avoid}</div>
    ${(S.funnel||[]).length ? `<h2>Commission rate by priority country</h2>${bars(S.funnel.map(f=>({label:f.country,value:f.commRate,display:fmtPct(f.commRate)})),'success')}` : ''}
  `;
}

function renderLeague() {
  const S = seg();
  return `
    <h2>Top countries by composite score — ${state.seg}</h2>
    ${table(['Country','Score','Aff','Whales','Earners','Earn%','Commission','LTV/sig','CPA50','Action'],
      S.league.map(r=>[r.country,r.score.toFixed(1),fmtN(r.affiliates),fmtN(r.whales),String(r.earners),fmtPct(r.earnRate,r.earnRate>=1?1:2),fmtUSD(r.commission),fmtUSD(r.ltvSignup),fmtUSD(r.cpa50),r.action||'—']),
      {align:['left','right','right','right','right','right','right','right','right','left'],
       tones:S.league.map(r=>r.action==='Scale'?'success':r.action==='Test'?'info':undefined)})}
  `;
}

function renderPatterns() {
  const S = seg();
  return `
    <h2>Top campaigns — ${state.seg}</h2>
    ${S.topCampaigns.length ? table(['Campaign','Commission','Earners','Affiliates','Top country'],
      S.topCampaigns.map(c=>[c.campaign,fmtUSD(c.commission),String(c.earners),fmtN(c.affiliates),c.topCountry]),
      {align:['left','right','right','right','left']}) : '<p class="muted">No commission in this segment.</p>'}
    <h2>Program correlations (all affiliates)</h2>
    ${table(['Relationship','r','Takeaway'], P.correlations.map(c=>[c.pair,c.r==null?'—':c.r.toFixed(3),c.note]), {align:['left','right','left']})}
    <div class="callout info"><strong>Whale concentration</strong>
      ${fmtPct(P.whaleDefinition.whaleCommShare)} of commission sits in ${fmtN(P.whaleDefinition.whaleCount)} whales (all Vietnam).
      Non-whale CPA50 is ${fmtUSD(P.segments.non_whales.kpis.cpa50)} — volume geos without whale creation cannot support meaningful affiliate CPA.
    </div>
  `;
}

function bindLtv() {
  document.querySelectorAll('#scopePills .pill').forEach(p => {
    p.onclick = () => {
      state.scopeKind = p.dataset.kind;
      if (state.scopeKind==='country') state.geoId = seg().geo.entities['Vietnam'] ? 'Vietnam' : (seg().geo.options.find(o=>o.kind==='country')||{}).id;
      if (state.scopeKind==='region') state.geoId = 'Southeast Asia';
      if (state.scopeKind==='program') state.geoId = 'All countries';
      render();
    };
  });
  const sel = document.getElementById('geoSelect');
  if (sel) sel.onchange = () => { state.geoId = sel.value; render(); };
}

function render() {
  renderShell();
  const app = document.getElementById('app');
  if (state.tab==='ltv') app.innerHTML = renderLtv();
  else if (state.tab==='vietnam') app.innerHTML = renderVietnam();
  else if (state.tab==='priorities') app.innerHTML = renderPriorities();
  else if (state.tab==='league') app.innerHTML = renderLeague();
  else app.innerHTML = renderPatterns();
  if (state.tab==='ltv') bindLtv();
}
render();
</script>
</body>
</html>
