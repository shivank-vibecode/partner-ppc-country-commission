"clientPnl":0.0,"ltvSignup":0.0,"cpa50":0.0},{"campaign":"latam_north-prosp-affiliate_ebook-1125-es-fb","n":43,"earners":0,"earnRate":0.0,"clientPnl":0.0,"ltvSignup":0.0,"cpa50":0.0},{"campaign":"latam_north-prosp-usp-1125-es-fb","n":94,"earners":0,"earnRate":0.0,"clientPnl":0.0,"ltvSignup":0.0,"cpa50":0.0}],"sources":[{"source":"google","n":5,"earners":0,"earnRate":0.0,"ltvSignup":0.0,"cpa50":0.0,"clientPnl":0.0},{"source":"Meta","n":981,"earners":0,"earnRate":0.0,"ltvSignup":0.0,"cpa50":0.0,"clientPnl":0.0}],"layerA":{"ltvSignup":0.0,"cpa30":0.0,"cpa50":0.0,"cpa100":0.0},"layerB":{"activeCpa50":0.0,"clientsCpa50":0.0,"fundedCpa50":0.0,"earnerCpa50":0.0,"activeN":2,"clientsN":2,"fundedN":0,"earnerN":0}}}},"vietnam":{"n":454,"earners":58,"whales":0,"clientPnl":17899.83,"ltvSignup":39.43,"cpa50":19.71,"stageEcon":[{"stage":"All signups","n":454,"ltv":39.43,"clientPnl":17899.83,"cpa30":11.83,"cpa50":19.71,"cpa100":39.43},{"stage":"Active","n":74,"ltv":241.89,"clientPnl":17899.83,"cpa30":72.57,"cpa50":120.94,"cpa100":241.89},{"stage":"Clients>0","n":74,"ltv":241.89,"clientPnl":17899.83,"cpa30":72.57,"cpa50":120.94,"cpa100":241.89},{"stage":"Funded","n":68,"ltv":263.23,"clientPnl":17899.83,"cpa30":78.97,"cpa50":131.62,"cpa100":263.23},{"stage":"Earners","n":58,"ltv":474.51,"clientPnl":27521.84,"cpa30":142.35,"cpa50":237.26,"cpa100":474.51}]}}},"correlations":[{"pair":"Client deposits \u2194 Client PnL (LTV)","r":0.4,"note":"Deposit capital vs client PnL"},{"pair":"Clients acquired \u2194 Client PnL (LTV)","r":0.108,"note":"Client count vs PnL"},{"pair":"Commission \u2194 Client PnL (LTV)","r":0.657,"note":"Payout vs client PnL"},{"pair":"Affiliate deposits \u2194 Client PnL (LTV)","r":0.002,"note":"Self-funding vs client PnL"}]}</script>
<script>
const P = JSON.parse(document.getElementById('payload').textContent);
const state = { seg:'all', tab:'ltv', scopeKind:'country', geoId:'Vietnam' };
const TABS = [
  {id:'ltv',label:'LTV & CPA'},
  {id:'vietnam',label:'Vietnam'},
  {id:'priorities',label:'Scale & Test'},
  {id:'league',label:'Country league'},
  {id:'patterns',label:'Patterns'},
];
const fmtUSD = (v) => {
  if (v == null || Number.isNaN(Number(v))) return '—';
  const n = Number(v);
  const sign = n < 0 ? '-' : '';
  const a = Math.abs(n);
  if (a >= 1000) return `${sign}$${(a/1000).toFixed(a >= 10000 ? 0 : 1)}k`;
  return `${sign}$${a.toFixed(2)}`;
};
const fmtPct = (v,d=1) => `${Number(v).toFixed(d)}%`;
const fmtN = (v) => Number(v).toLocaleString('en-US');
const seg = () => P.segments[state.seg];

function table(headers, rows, opts={}) {
  const aligns = opts.align || headers.map(()=> 'left');
  const tones = opts.tones || [];
  const head = headers.map((h,i)=>`<th class="${aligns[i]==='right'?'num':''}">${h}</th>`).join('');
  const body = rows.map((r,ri)=>`<tr class="${tones[ri]?`hl-${tones[ri]}`:''}">${r.map((c,i)=>`<td class="${aligns[i]==='right'?'num':''}">${c}</td>`).join('')}</tr>`).join('');
  return `<div style="overflow:auto"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function bars(items, tone='') {
  const max = Math.max(...items.map(i=>Math.abs(i.value)), 1);
  return `<div class="bar-wrap">${items.map(i=>`
    <div class="bar-row"><div>${i.label}</div>
    <div class="bar-track"><div class="bar-fill ${tone}" style="width:${(100*Math.abs(i.value)/max).toFixed(1)}%"></div></div>
    <div class="num">${i.display ?? fmtN(i.value)}</div></div>`).join('')}</div>`;
}

function renderShell() {
  const L = P.ltvDefinition, W = P.whaleDefinition, S = seg(), k = S.kpis;
  document.getElementById('defBox').innerHTML = `<strong>LTV definition</strong>${L.rule}. ${L.detail}
    Whale split (separate): ${W.rule}. Whales hold ${fmtPct(W.whaleLtvShare)} of Client PnL LTV (${fmtUSD(W.whaleLtv)}).`;
  const a=P.segments.all.kpis, w=P.segments.whales.kpis, n=P.segments.non_whales.kpis;
  document.getElementById('compareStrip').innerHTML = `
    <div class="stat"><div class="v">${fmtUSD(a.ltvSignup)}</div><div class="l">All · LTV / signup (Client PnL)</div></div>
    <div class="stat warning"><div class="v">${fmtUSD(w.ltvSignup)}</div><div class="l">Whales · LTV / whale</div></div>
    <div class="stat info"><div class="v">${fmtUSD(n.ltvSignup)}</div><div class="l">Non-whales · LTV / signup</div></div>`;
  document.getElementById('topKpis').innerHTML = [
    [fmtN(k.affiliates),'Affiliates in view'],
    [fmtN(k.whales),'Whales in view','warning'],
    [fmtUSD(k.clientPnl),'Total LTV (Client PnL)','success'],
    [fmtUSD(k.ltvSignup),'LTV / signup','info'],
    [fmtUSD(k.cpa50),'CPA 50%','warning'],
    [`${fmtN(k.earners)} (${fmtPct(k.earnerPct)})`,'Earners'],
  ].map(([v,l,t])=>`<div class="stat ${t||''}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
  document.getElementById('tabs').innerHTML = TABS.map(t=>`<button class="tab ${state.tab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });
  document.querySelectorAll('#segPills .pill').forEach(b => {
    b.classList.toggle('active', b.dataset.seg === state.seg);
    b.onclick = () => { state.seg = b.dataset.seg; state.geoId = seg().geo.defaultId; state.scopeKind='country'; render(); };
  });
}

function renderLtv() {
  const S = seg(), geo = S.geo;
  const optionsForKind = geo.options.filter(o => o.kind === state.scopeKind);
  if (!optionsForKind.some(o => o.id === state.geoId)) state.geoId = optionsForKind[0]?.id || geo.defaultId;
  const ent = geo.entities[state.geoId];
  if (!ent) return `<div class="callout">No data in this segment.</div>`;
  const a = ent.layerA, b = ent.layerB;
  const earnCamps = (ent.campaigns||[]).filter(c => c.clientPnl !== 0);
  const kindLabel = ent.kind === 'program' ? 'program-wide' : ent.kind === 'region' ? 'this region' : 'this country';
  const selectOpts = optionsForKind.map(o => {
    const pnl = fmtUSD(o.clientPnl);
    const label = o.kind === 'program' ? `${o.id} (${fmtN(o.n)} aff)` : `${o.id} · ${fmtN(o.n)} aff · LTV ${pnl}`;
    return `<option value="${o.id.replace(/"/g,'&quot;')}" ${o.id===state.geoId?'selected':''}>${label}</option>`;
  }).join('');

  return `
    <div class="callout info"><strong>LTV = Client PnL USD</strong>
      CPA caps = Client PnL per acquired affiliate × payback share. No Deriv revenue-share inversion.
    </div>
    <div class="card">
      <h2>CPA math — three layers</h2>
      <div class="pills" id="scopePills">
        <button class="pill ${state.scopeKind==='country'?'active':''}" data-kind="country">Countries</button>
        <button class="pill ${state.scopeKind==='region'?'active':''}" data-kind="region">Regions</button>
        <button class="pill ${state.scopeKind==='program'?'active':''}" data-kind="program">All countries</button>
      </div>
      ${state.scopeKind !== 'program' ? `<select id="geoSelect">${selectOpts}</select>` : ''}
      <p class="muted">Selected: ${ent.id} · ${fmtN(ent.n)} aff · LTV total ${fmtUSD(ent.clientPnl)} · LTV/signup ${fmtUSD(ent.ltvSignup)}</p>
      <p>Layer A — Blended signup: LTV/signup ${fmtUSD(a.ltvSignup)}. CPA50 ${fmtUSD(a.cpa50)} · CPA30 ${fmtUSD(a.cpa30)} · CPA100 ${fmtUSD(a.cpa100)}.</p>
      <p>Layer B — Stage-gated CPA50 (${kindLabel}): Active ${fmtUSD(b.activeCpa50)} (n=${fmtN(b.activeN)}); Clients&gt;0 ${fmtUSD(b.clientsCpa50)}; Funded ${fmtUSD(b.fundedCpa50)}; Earner ${fmtUSD(b.earnerCpa50)}.</p>
      <p>Layer C — Campaign CPA50: ${earnCamps.length ? earnCamps.slice(0,4).map(c=>`${c.campaign} ~${fmtUSD(c.cpa50)}`).join('; ') : 'No Client PnL in campaigns for this slice.'}</p>
      ${table(['If you acquire…','n','LTV (Client PnL / aff)','CPA 30%','CPA 50%','CPA 100%'],
        ent.stageEcon.map(r=>[r.stage, fmtN(r.n), fmtUSD(r.ltv), fmtUSD(r.cpa30), fmtUSD(r.cpa50), fmtUSD(r.cpa100)]),
        {align:['left','right','right','right','right','right']})}
      ${(ent.campaigns||[]).length ? `<h3>Campaigns — ${ent.id}</h3>` + table(['Campaign','n','Earn %','LTV total','LTV/sig','CPA50'],
        ent.campaigns.map(c=>[c.campaign,fmtN(c.n),fmtPct(c.earnRate),fmtUSD(c.clientPnl),fmtUSD(c.ltvSignup),fmtUSD(c.cpa50)]),
        {align:['left','right','right','right','right','right']}) : ''}
    </div>
    <h2>Country LTV snapshot</h2>
    ${table(['Country','Affiliates','Whales','LTV total','LTV / signup','CPA50','Score'],
      S.league.slice(0,15).map(r=>[r.country,fmtN(r.affiliates),fmtN(r.whales),fmtUSD(r.clientPnl),fmtUSD(r.ltv),fmtUSD(r.cpa50),r.score.toFixed(1)]),
      {align:['left','right','right','right','right','right','right'],
       tones:S.league.slice(0,15).map(r=>r.action==='Scale'?'success':r.action==='Test'?'info':undefined)})}
  `;
}

function renderVietnam() {
  const v = seg().vietnam;
  if (!v || !v.n) return `<div class="callout">No Vietnam affiliates in this segment.</div>`;
  return `
    <h2>Vietnam — LTV = Client PnL</h2>
    <div class="grid grid-3">
      <div class="stat"><div class="v">${fmtN(v.n)}</div><div class="l">Affiliates</div></div>
      <div class="stat warning"><div class="v">${fmtN(v.whales)}</div><div class="l">Whales</div></div>
      <div class="stat success"><div class="v">${fmtUSD(v.clientPnl)}</div><div class="l">LTV total (Client PnL)</div></div>
      <div class="stat info"><div class="v">${fmtUSD(v.ltvSignup)}</div><div class="l">LTV / signup</div></div>
      <div class="stat warning"><div class="v">${fmtUSD(v.cpa50)}</div><div class="l">CPA 50%</div></div>
      <div class="stat"><div class="v">${fmtN(v.earners)}</div><div class="l">Earners</div></div>
    </div>
    <div class="card">
      <h2>CPA math — Vietnam</h2>
      ${table(['If you acquire…','n','LTV (Client PnL / aff)','CPA 30%','CPA 50%','CPA 100%'],
        v.stageEcon.map(s=>[s.stage,fmtN(s.n),fmtUSD(s.ltv),fmtUSD(s.cpa30),fmtUSD(s.cpa50),fmtUSD(s.cpa100)]),
        {align:['left','right','right','right','right','right']})}
    </div>
  `;
}

function renderPriorities() {
  const S = seg();
  const row = r => [r.country, fmtN(r.affiliates), fmtN(r.whales), fmtUSD(r.clientPnl), fmtUSD(r.ltv), fmtUSD(r.cpa50), r.score.toFixed(1), r.action];
  const avoid = (S.avoid||[]).map(a=>`${a.country} (${fmtN(a.affiliates)})`).join(', ') || 'None';
  return `
    <div class="grid grid-2">
      <div class="card"><h2>Scale</h2>
        ${S.scale.length ? table(['Country','Aff','Whales','LTV total','LTV/sig','CPA50','Score','Action'], S.scale.map(row),
          {align:['left','right','right','right','right','right','right','left'], tones:S.scale.map(r=>r.country==='Vietnam'?'success':undefined)})
          : '<p class="muted">No Scale countries.</p>'}
      </div>
      <div class="card"><h2>Test</h2>
        ${S.test.length ? table(['Country','Aff','Whales','LTV total','LTV/sig','CPA50','Score','Action'], S.test.map(row),
          {align:['left','right','right','right','right','right','right','left']})
          : '<p class="muted">No Test countries.</p>'}
      </div>
    </div>
    <div class="callout"><strong>Deprioritize</strong>${avoid}</div>
    ${(S.funnel||[]).length ? `<h2>LTV / signup by priority country</h2>${bars(S.funnel.map(f=>({label:f.country,value:f.ltv,display:fmtUSD(f.ltv)})),'success')}` : ''}
  `;
}

function renderLeague() {
  const S = seg();
  return `
    <h2>Top countries by score — LTV = Client PnL</h2>
    ${table(['Country','Score','Aff','Whales','LTV total','LTV / signup','CPA50','Earners','Action'],
      S.league.map(r=>[r.country,r.score.toFixed(1),fmtN(r.affiliates),fmtN(r.whales),fmtUSD(r.clientPnl),fmtUSD(r.ltv),fmtUSD(r.cpa50),String(r.earners),r.action||'—']),
      {align:['left','right','right','right','right','right','right','right','left'],
       tones:S.league.map(r=>r.action==='Scale'?'success':r.action==='Test'?'info':undefined)})}
  `;
}

function renderPatterns() {
  const S = seg();
  return `
    <h2>Top campaigns by Client PnL (LTV)</h2>
    ${S.topCampaigns.length ? table(['Campaign','LTV total','LTV / aff','Earners','Affiliates','Top country'],
      S.topCampaigns.map(c=>[c.campaign,fmtUSD(c.clientPnl),fmtUSD(c.ltv),String(c.earners),fmtN(c.affiliates),c.topCountry]),
      {align:['left','right','right','right','right','left']}) : '<p class="muted">No Client PnL in this segment.</p>'}
    <h2>Correlations with Client PnL (LTV)</h2>
    ${table(['Relationship','r','Note'], P.correlations.map(c=>[c.pair,c.r==null?'—':c.r.toFixed(3),c.note]), {align:['left','right','left']})}
  `;
}

function bindLtv() {
  document.querySelectorAll('#scopePills .pill').forEach(p => {
    p.onclick = () => {
      state.scopeKind = p.dataset.kind;
      if (state.scopeKind==='country') state.geoId = seg().geo.entities['Vietnam'] ? 'Vietnam' : (seg().geo.options.find(o=>o.kind==='country')||{}).id;
      if (state.scopeKind==='region') state.geoId = 'Southeast Asia';
      if (state.scopeKind==='program') state.geoId = 'All countries';
      render();
    };
  });
  const sel = document.getElementById('geoSelect');
  if (sel) sel.onchange = () => { state.geoId = sel.value; render(); };
}

function render() {
  renderShell();
  const app = document.getElementById('app');
  if (state.tab==='ltv') app.innerHTML = renderLtv();
  else if (state.tab==='vietnam') app.innerHTML = renderVietnam();
  else if (state.tab==='priorities') app.innerHTML = renderPriorities();
  else if (state.tab==='league') app.innerHTML = renderLeague();
  else app.innerHTML = renderPatterns();
  if (state.tab==='ltv') bindLtv();
}
render();
</script>
</body>
